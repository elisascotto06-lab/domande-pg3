<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Regia · Politicamente Giovani</title>
<link rel="icon" href="/logo.png">
<style>
  :root{--bg:#071820;--bg2:#0b2430;--card:#0e2a38;--line:#1d4556;--accent:#14a8bd;--dark:#0a2a3a;--text:#f3f7f8;--muted:#8fb0bb;--warn:#f2b84b;--bad:#e5786a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* login */
  #login{max-width:360px;margin:12vh auto 0;padding:0 20px;text-align:center}
  #login img{width:84px;height:84px;border-radius:50%;margin-bottom:18px}
  #login h1{font-size:24px;margin:0 0 20px}
  #login input{width:100%;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;font-size:17px}
  #login input:focus{outline:none;border-color:var(--accent)}
  #login .go{width:100%;margin-top:12px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--dark);font-weight:700;font-size:17px}
  #loginErr{color:var(--bad);min-height:22px;margin-top:10px;font-size:15px}

  /* barra alta */
  header{position:sticky;top:0;z-index:5;background:rgba(7,24,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px}
  .bar{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar img{width:38px;height:38px;border-radius:50%}
  .bar h1{font-size:18px;margin:0;flex:1;min-width:140px}
  .pill{border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .pill .led{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .pill.off .led{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .pill.mute{color:var(--muted)}
  .tabs{max-width:900px;margin:12px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;border:0;background:var(--bg2);color:var(--muted);border-radius:999px;padding:9px 16px;font-size:15px}
  .tab b{color:var(--text);margin-left:4px}
  .tab.on{background:var(--accent);color:var(--dark)}
  .tab.on b{color:var(--dark)}

  /* lista */
  main{max-width:900px;margin:0 auto;padding:18px 18px 80px}
  .vuoto{text-align:center;color:var(--muted);padding:70px 20px;font-size:18px}
  .q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:12px}
  .q.selezionata{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
  .q.letta{opacity:.55}
  .q.scartata{opacity:.4}
  .q .t{font-size:20px;line-height:1.4;margin:0 0 12px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .q.scartata .t{text-decoration:line-through}
  .q .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .q .ora{color:var(--muted);font-size:13px;margin-right:auto}
  .act{border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:8px 13px;font-size:14px}
  .act:hover{border-color:var(--accent)}
  .act.star.on{background:var(--warn);border-color:var(--warn);color:#2a1d00;font-weight:700}
  .act.big{background:var(--accent);border-color:var(--accent);color:var(--dark);font-weight:700}
  .act.del{color:var(--bad)}
  .badge{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--accent);color:var(--dark)}

  /* schermo lettura */
  #lettura{position:fixed;inset:0;z-index:20;background:#030c10;display:flex;flex-direction:column;padding:24px}
  #lettura .x{align-self:flex-end;border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:10px 18px;font-size:16px}
  #lettura .corpo{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  #lettura p{font-size:clamp(30px,5.6vw,72px);line-height:1.25;font-weight:700;max-width:1100px;margin:0;overflow-wrap:anywhere}
  #lettura .nav{display:flex;gap:12px;justify-content:center}
  #lettura .nav button{border:0;background:var(--accent);color:var(--dark);font-weight:700;font-size:18px;border-radius:14px;padding:16px 28px}
  #lettura .nav button.sec{background:transparent;border:1.5px solid var(--line);color:var(--text)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#12394a;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>

<section id="login">
  <img src="/logo.png" alt="">
  <h1>Regia domande</h1>
  <form id="loginForm">
    <input type="password" id="pwd" placeholder="Password della regia" autocomplete="current-password" autofocus>
    <button class="go" type="submit">Entra</button>
    <div id="loginErr"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <img src="/logo.png" alt="">
      <h1>Regia domande</h1>
      <button class="pill" id="toggleAperte" title="Apri o chiudi la ricezione di nuove domande"><span class="led"></span><span id="aperteTxt">Domande aperte</span></button>
      <button class="pill mute" id="esci">Esci</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="lista"></main>
</div>

<div id="lettura" class="hidden">
  <button class="x" id="chiudiLettura">Chiudi ✕</button>
  <div class="corpo"><p id="testoGrande"></p></div>
  <div class="nav">
    <button class="sec" id="prec">← Precedente</button>
    <button id="segnaLetta">Segna come letta</button>
    <button class="sec" id="succ">Successiva →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let pwd = sessionStorage.getItem("pwd") || "";
let domande = [], aperte = true, filtro = "attive", timer = null, inLettura = null;

const FILTRI = [
  ["attive", "Da vedere", d => d.stato === "nuova" || d.stato === "selezionata"],
  ["nuova", "Nuove", d => d.stato === "nuova"],
  ["selezionata", "Selezionate", d => d.stato === "selezionata"],
  ["letta", "Lette", d => d.stato === "letta"],
  ["scartata", "Scartate", d => d.stato === "scartata"],
  ["tutte", "Tutte", d => true],
];

async function api(percorso, metodo = "GET", corpo) {
  const r = await fetch("/api/regia" + percorso, {
    method: metodo,
    headers: { "x-regia-password": pwd, "Content-Type": "application/json" },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (r.status === 401) { esci(true); throw new Error("401"); }
  return r.json();
}

function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),1800); }

async function aggiorna() {
  try {
    const dati = await api("/domande");
    const nuoveArrivate = dati.domande.filter(d => !domande.some(x => x.id === d.id)).length;
    const primoGiro = domande.length === 0 && !aggiorna.fatto;
    domande = dati.domande; aperte = dati.aperte; aggiorna.fatto = true;
    if (nuoveArrivate && !primoGiro) toast(nuoveArrivate === 1 ? "Nuova domanda arrivata" : nuoveArrivate + " nuove domande");
    disegna();
  } catch (_) {}
}

function disegna() {
  // stato apertura
  $("toggleAperte").classList.toggle("off", !aperte);
  $("aperteTxt").textContent = aperte ? "Domande aperte" : "Domande chiuse";

  // schede
  $("tabs").innerHTML = "";
  for (const [id, nome, fn] of FILTRI) {
    const b = document.createElement("button");
    b.className = "tab" + (filtro === id ? " on" : "");
    b.append(nome + " ");
    const n = document.createElement("b"); n.textContent = domande.filter(fn).length; b.append(n);
    b.onclick = () => { filtro = id; disegna(); };
    $("tabs").append(b);
  }

  // elenco (più recenti in alto, tranne per "selezionate": ordine di arrivo)
  const fn = FILTRI.find(f => f[0] === filtro)[2];
  const elenco = domande.filter(fn).sort((a, b) => b.creata - a.creata);
  const lista = $("lista"); lista.innerHTML = "";
  if (!elenco.length) {
    const v = document.createElement("div"); v.className = "vuoto";
    v.textContent = domande.length ? "Nessuna domanda in questa sezione." : "Ancora nessuna domanda. Appena ne arriva una la vedrai qui.";
    lista.append(v); return;
  }
  for (const d of elenco) lista.append(scheda(d));
}

function scheda(d) {
  const el = document.createElement("article"); el.className = "q " + d.stato;
  const t = document.createElement("p"); t.className = "t"; t.textContent = d.testo; el.append(t);
  const meta = document.createElement("div"); meta.className = "meta";
  const ora = document.createElement("span"); ora.className = "ora";
  ora.textContent = new Date(d.creata).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  meta.append(ora);
  if (d.stato === "nuova") { const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = "NUOVA"; meta.insertBefore(bd, ora); }

  const bottone = (testo, classe, fn) => { const b = document.createElement("button"); b.className = "act " + classe; b.textContent = testo; b.onclick = fn; meta.append(b); };
  bottone("Leggi in grande", "big", () => apriLettura(d.id));
  bottone(d.stato === "selezionata" ? "★ Selezionata" : "☆ Seleziona", "star" + (d.stato === "selezionata" ? " on" : ""),
    () => cambia(d.id, d.stato === "selezionata" ? "nuova" : "selezionata"));
  if (d.stato === "letta" || d.stato === "scartata") bottone("Ripristina", "", () => cambia(d.id, "nuova"));
  else {
    bottone("Letta", "", () => cambia(d.id, "letta"));
    bottone("Scarta", "", () => cambia(d.id, "scartata"));
  }
  bottone("Elimina", "del", () => { if (confirm("Eliminare definitivamente questa domanda?")) elimina(d.id); });
  el.append(meta);
  return el;
}

async function cambia(id, stato) {
  const d = domande.find(x => x.id === id); if (d) d.stato = stato; disegna();
  try { await api("/domande/" + id, "POST", { stato }); } catch (_) {}
}
async function elimina(id) {
  domande = domande.filter(x => x.id !== id); disegna();
  try { await api("/domande/" + id, "DELETE"); } catch (_) {}
}

$("toggleAperte").onclick = async () => {
  const nuovo = !aperte;
  if (!nuovo && !confirm("Chiudere la ricezione? Il pubblico non potrà più inviare domande finché non la riapri.")) return;
  try { const r = await api("/stato", "POST", { aperte: nuovo }); aperte = r.aperte; disegna(); toast(aperte ? "Domande riaperte" : "Domande chiuse"); } catch (_) {}
};

/* ---- lettura a schermo intero ---- */
function listaLettura() {
  const fn = FILTRI.find(f => f[0] === filtro)[2];
  return domande.filter(fn).sort((a, b) => b.creata - a.creata);
}
function apriLettura(id) { inLettura = id; mostraLettura(); $("lettura").classList.remove("hidden"); }
function mostraLettura() {
  const d = domande.find(x => x.id === inLettura);
  if (!d) { $("lettura").classList.add("hidden"); inLettura = null; return; }
  $("testoGrande").textContent = d.testo;
}
function vicina(passo) {
  const l = listaLettura(); const i = l.findIndex(x => x.id === inLettura);
  const n = l[i + passo]; if (n) { inLettura = n.id; mostraLettura(); } else toast("Non ce ne sono altre");
}
$("prec").onclick = () => vicina(-1);
$("succ").onclick = () => vicina(1);
$("segnaLetta").onclick = async () => {
  const l = listaLettura(); const i = l.findIndex(x => x.id === inLettura);
  await cambia(inLettura, "letta");
  const prossima = listaLettura()[i] || listaLettura()[i - 1];
  if (prossima) { inLettura = prossima.id; mostraLettura(); } else { $("lettura").classList.add("hidden"); inLettura = null; }
};
$("chiudiLettura").onclick = () => { $("lettura").classList.add("hidden"); inLettura = null; };
document.addEventListener("keydown", (e) => {
  if (!inLettura) return;
  if (e.key === "Escape") $("chiudiLettura").click();
  if (e.key === "ArrowRight") vicina(1);
  if (e.key === "ArrowLeft") vicina(-1);
});

/* ---- accesso ---- */
function entra() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  aggiorna(); clearInterval(timer); timer = setInterval(aggiorna, 3000);
}
function esci(forzato) {
  clearInterval(timer); sessionStorage.removeItem("pwd"); pwd = ""; domande = [];
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("loginErr").textContent = forzato === true ? "Password non corretta." : ""; $("pwd").value = ""; $("pwd").focus();
}
$("esci").onclick = () => esci();
$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); pwd = $("pwd").value;
  const r = await fetch("/api/regia/domande", { headers: { "x-regia-password": pwd } });
  if (r.ok) { sessionStorage.setItem("pwd", pwd); entra(); }
  else { $("loginErr").textContent = "Password non corretta."; }
};
if (pwd) entra();
</script>
</body>
</html>
